<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Code Copy Component</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-color: #c9d1d9;
            --accent-color: #58a6ff;
            --success-color: #3fb950;
            --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
        }

        body {
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Container styling */
        .code-block-container {
            position: relative;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            width: 90%;
            max-width: 600px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        /* Header bar area */
        .code-block-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            background-color: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid var(--border-color);
        }

        .language-label {
            color: #8b949e;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Copy Button styling */
        .copy-btn {
            position: relative;
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            padding: 6px 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .copy-btn:hover {
            background-color: #21262d;
            border-color: #8b949e;
        }

        .copy-btn:focus-visible {
            outline: 2px solid var(--accent-color);
            outline-offset: 2px;
        }

        /* Tooltip notification state */
        .copy-btn::after {
            content: "Copied!";
            position: absolute;
            bottom: 130%;
            left: 50%;
            transform: translateX(-50%) translateY(5px);
            background-color: var(--success-color);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transition: transform 0.2s ease, opacity 0.2s ease;
            pointer-events: none;
        }

        .copy-btn.copied::after {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        /* Pre/Code box wrapper */
        pre {
            margin: 0;
            padding: 16px;
            overflow-x: auto;
        }

        code {
            font-family: var(--font-mono);
            color: var(--text-color);
            font-size: 0.9rem;
            line-height: 1.5;
            white-space: pre;
        }
    </style>
</head>
<body>

    <div class="code-block-container">
        <div class="code-block-header">
            <span class="language-label">HTML</span>
            <button class="copy-btn" id="copyButton" aria-label="Copy code snippet">
                <!-- SVG Icon for Copy -->
                <svg id="copyIcon" width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                    <path d="M0 6.75C0 5.784.784 5 1.75 5h1.5a.75.75 0 0 1 0 1.5h-1.5a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-1.5a.75.75 0 0 1 1.5 0v1.5A1.75 1.75 0 0 1 9.25 16h-7.5A1.75 1.75 0 0 1 0 14.25Z"></path>
                    <path d="M5 1.75C5 .784 5.784 0 6.75 0h7.5C15.216 0 16 .784 16 1.75v7.5A1.75 1.75 0 0 1 14.25 11h-7.5A1.75 1.75 0 0 1 5 9.25Zm1.75-.25a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-7.5a.25.25 0 0 0-.25-.25Z"></path>
                </svg>
                <span id="btnText">Copy</span>
            </button>
        </div>
        <pre><code id="codeText">&lt;div class="hero-section"&gt;
    &lt;h1&gt;Welcome to the Future&lt;/h1&gt;
    &lt;p&gt;This component features state preservation.&lt;/p&gt;
&lt;/div&gt;</code></pre>
    </div>

    <script>
        const copyButton = document.getElementById('copyButton');
        const codeText = document.getElementById('codeText');
        const btnText = document.getElementById('btnText');
        
        // Success SVG Checkmark icon string to swap dynamically
        const checkIconSvg = `<path d="M13.78 4.22a.75.75 0 0 1 0 1.06l-7.25 7.25a.75.75 0 0 1-1.06 0L2.22 9.28a.751.751 0 0 1 .018-1.042.751.751 0 0 1 1.042-.018L6 10.94l6.72-6.72a.75.75 0 0 1 1.06 0Z"></path>`;
        // Original copy icon string
        const copyIconSvg = `<path d="M0 6.75C0 5.784.784 5 1.75 5h1.5a.75.75 0 0 1 0 1.5h-1.5a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-1.5a.75.75 0 0 1 1.5 0v1.5A1.75 1.75 0 0 1 9.25 16h-7.5A1.75 1.75 0 0 1 0 14.25Z"></path><path d="M5 1.75C5 .784 5.784 0 6.75 0h7.5C15.216 0 16 .784 16 1.75v7.5A1.75 1.75 0 0 1 14.25 11h-7.5A1.75 1.75 0 0 1 5 9.25Zm1.75-.25a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-7.5a.25.25 0 0 0-.25-.25Z"></path>`;
        const copyIcon = document.getElementById('copyIcon');

        copyButton.addEventListener('click', async () => {
            try {
                // Extract plain text from code block
                const textToCopy = codeText.innerText;
                
                // Modern Async Clipboard API approach
                await navigator.clipboard.writeText(textToCopy);
                
                // Add active tooltip class & toggle visual states
                copyButton.classList.add('copied');
                copyButton.style.borderColor = 'var(--success-color)';
                copyButton.style.color = 'var(--success-color)';
                copyIcon.innerHTML = checkIconSvg;
                btnText.innerText = "Copied!";

                // Revert component state after 2 seconds
                setTimeout(() => {
                    copyButton.classList.remove('copied');
                    copyButton.style.borderColor = 'var(--border-color)';
                    copyButton.style.color = 'var(--text-color)';
                    copyIcon.innerHTML = copyIconSvg;
                    btnText.innerText = "Copy";
                }, 2000);

            } catch (err) {
                console.error('Failed to copy text: ', err);
                btnText.innerText = "Error";
            }
        });
    </script>
</body>
</html>
